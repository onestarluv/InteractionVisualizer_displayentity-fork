name: kokonut_ineteraction
author: pingpong
contributors: [LOOHP]
website: https://wiki.egoverse.kr
version: ${project.version}
main: com.loohp.interactionvisualizer.InteractionVisualizer
api-version: '26.3'
folia-supported: true
description: 에고버스 플러그인
softdepend:
  - LightAPI
  - OpenInv
  - SuperVanish
  - PremiumVanish
  - CMI
  - Essentials
  - PlaceholderAPI
prefix: kokonut_ineteraction

commands:
  시각효과:
    usage: /<command>
    aliases: [iv, interactionvisualizer, 인터랙션비주얼라이저]
    description: 개인별 시각 효과 설정 및 플러그인 관리

permissions:
  interactionvisualizer.reload:
    description: 플러그인 공통 설정을 다시 불러옵니다.
    default: op
  interactionvisualizer.refresh:
    description: 본인 화면의 시각 효과를 새로고침합니다.
    default: true
  interactionvisualizer.toggle:
    description: 개인 시각 효과를 켜거나 끕니다.
    default: true
  interactionvisualizer.toggle.others:
    description: 다른 플레이어의 시각 효과 설정을 변경합니다.
    default: op
